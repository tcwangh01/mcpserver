# Spring Boot Application Configuration
spring.application.name=mcp-weather-spring-boot

# Logging Configuration - output to file only to avoid polluting STDIO
logging.level.root=WARN
logging.level.com.example.mcpweather=INFO

# Disable console logging completely
logging.pattern.console=

# Disable Spring Boot banner
spring.main.banner-mode=off

# Disable web server (we use STDIO)
spring.main.web-application-type=none
