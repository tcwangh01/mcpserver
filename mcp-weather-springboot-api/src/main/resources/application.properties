# Spring Boot Application Configuration
spring.application.name=mcp-weather-api

# HTTP API 模式（預設）
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.mcpweather=INFO

# Disable Spring Boot banner
spring.main.banner-mode=off

# MCP mode (預設為 false，啟動 HTTP API)
mcp.mode=false
